# Nixpacks build config for the checker bot.
# Playwright's Python package does not ship the Chromium binary, so the
# browser must be downloaded (and its system libraries installed) during the
# build. Without this the CS screenshot gate crashes with:
#   BrowserType.launch: Executable doesn't exist at /root/.cache/ms-playwright/...

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt",
  ". /opt/venv/bin/activate && playwright install --with-deps chromium",
]